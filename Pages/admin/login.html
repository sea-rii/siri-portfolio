<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SiriFlix Studio Login</title>
  <link rel="stylesheet" href="./admin.css" />
</head>
<body class="admin-login-page">
  <div class="admin-bg-overlay"></div>

  <main class="login-shell">
    <section class="login-card">
      <div class="brand-block">
        <p class="brand-kicker">HEY SIRI</p>
        <h1 class="brand-title">SiriFlix Studio</h1>
        <p class="brand-subtitle">
          Sign in to manage your portfolio, projects, uploads, settings, and analytics.
        </p>
      </div>

      <form id="login-form" class="admin-form">
        <label for="email" class="admin-label">Email</label>
        <input type="email" id="email" class="admin-input" placeholder="Enter your email" required />

        <label for="password" class="admin-label">Password</label>
        <input type="password" id="password" class="admin-input" placeholder="Enter your password" required />

        <button type="submit" class="netflix-btn full-width-btn">Sign In</button>
        <p id="login-message" class="form-message"></p>
      </form>

      <div class="login-footer-note">
        <span class="note-dot"></span>
        Private admin access only
      </div>
    </section>
  </main>

  <script src="./admin.js"></script>
</body>
</html>
